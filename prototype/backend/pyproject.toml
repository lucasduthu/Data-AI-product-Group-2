[project]
name = "rightscopilot-backend"
version = "0.1.0"
description = "Backend FastAPI pour RightsCopilot - Gestion de droits d'édition, parsing de contrats et réconciliation de relevés"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    "fastembed>=0.3.6",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "reportlab>=4.2.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
